name: Test userscript
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check user_scripts/codex-retry-rescue.js
      - run: node --test tests/retry-rescue.test.mjs
